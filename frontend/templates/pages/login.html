<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Đăng nhập · Lotus Hotel AI</title><link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head><body class="login-body"><div class="login-card"><div class="brand justify-content-center mb-4"><span class="brand-mark">L</span><span><b>Lotus Hotel</b><small>Smart Management</small></span></div><h2>Chào mừng trở lại</h2><p class="text-secondary">Đăng nhập để quản lý khách sạn của bạn</p>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<form method="post"><label class="form-label" for="loginUsername">Tên đăng nhập</label><input class="form-control form-control-lg mb-3" id="loginUsername" name="username" autocomplete="username" required><label class="form-label" for="loginPassword">Mật khẩu</label><input class="form-control form-control-lg mb-4" id="loginPassword" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary btn-lg w-100">Đăng nhập</button></form>{% if show_demo %}<small class="d-block text-center text-secondary mt-4">Tài khoản demo: admin / Admin@123</small>{% endif %}</div></body></html>
