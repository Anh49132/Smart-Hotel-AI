<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Chứng từ nội bộ{% endblock %}</title><style>
*{box-sizing:border-box}body{font:14px/1.5 Arial,sans-serif;color:#152238;background:#eef1f6;margin:0;padding:24px}.paper{max-width:190mm;margin:auto;background:white;padding:28px;border:1px solid #ddd}h1{font-size:24px;margin-bottom:4px}h2{font-size:18px}small,.muted{color:#526174}.notice{border:1px solid #ccd5e1;padding:12px;margin:16px 0}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{padding:9px 6px;border-bottom:1px solid #ddd;vertical-align:top;text-align:left}th{background:#f5f7fa}.right{text-align:right;white-space:nowrap}.summary{margin-left:auto;max-width:340px}.summary p{display:flex;justify-content:space-between;gap:20px}.total{font-size:18px;font-weight:bold}.toolbar{max-width:190mm;margin:0 auto 18px;display:flex;gap:12px}a,button{color:#224bdd}.signatures{display:flex;justify-content:space-between;gap:32px;margin:40px 0 70px}.signatures div{text-align:center;flex:1}tr{break-inside:avoid}thead{display:table-header-group}@media(max-width:600px){body{padding:8px}.paper{padding:14px}.wide-table{overflow:auto}}@page{size:A4;margin:15mm}@media print{body{background:white;padding:0}.paper{border:0;padding:0;max-width:none}.toolbar{display:none}a{color:inherit;text-decoration:none}.wide-table{overflow:visible}th{background:white}h1,h2{break-after:avoid}}
</style></head><body><div class="toolbar"><button type="button" onclick="window.print()">In / Lưu PDF</button>{% block back %}{% endblock %}</div><article class="paper">{% block content %}{% endblock %}</article></body></html>
